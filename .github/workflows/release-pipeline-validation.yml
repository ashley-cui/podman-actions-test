name: Release Pipeline Validation
on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag, e.g. "main" or "v9.8.7")'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  validate-tokens:
    name: Validate GitHub tokens
    runs-on: ubuntu-latest
    steps:
    - name: Validate GITHUB_TOKEN
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GITHUB_TOKEN" | gh auth login --with-token
        gh auth status
        gh api "/repos/${{ github.repository }}" --jq '.name' > /dev/null
        echo "GITHUB_TOKEN is valid and has repo access"
    - name: Validate PODMANBOT_TOKEN
      env:
        GH_TOKEN: ${{ secrets.PODMANBOT_TOKEN }}
      run: |
        echo "$GH_TOKEN" | gh auth login --with-token
        gh auth status
        gh api "/repos/${{ github.repository }}" --jq '.default_branch' > /dev/null
        echo "PODMANBOT_TOKEN is valid and has repo access"

  build-artifacts:
    name: Build Artifacts
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
    secrets: inherit

  open-failure-issue:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: [validate-tokens, build-artifacts]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
    - name: Create failure issue
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        BODY="Release Pipeline Validation workflow failed.

        @containers/podman-maintainers PTAL

        **Workflow run:** $RUN_URL

        **Failed jobs:**
        - validate-tokens: ${{ needs.validate-tokens.result }}
        - build-artifacts: ${{ needs.build-artifacts.result }}
        "
        gh issue create \
          --repo "${{ github.repository }}" \
          --title "Release Pipeline Validation failed (${{ github.run_id }})" \
          --body "$BODY"
